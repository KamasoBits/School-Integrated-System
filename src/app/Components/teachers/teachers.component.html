<div class="teachers-page">
  <section class="teacher-form-card">
    <h2>Add Teacher</h2>
    <form (ngSubmit)="addTeacher()" #teacherForm="ngForm" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input id="firstName" name="firstName" type="text" [(ngModel)]="firstName" required />
        </div>
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input id="lastName" name="lastName" type="text" [(ngModel)]="lastName" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="subject">Subject</label>
          <input id="subject" name="subject" type="text" [(ngModel)]="subject" required />
        </div>
        <div class="form-group">
          <label for="grade">Grade</label>
          <select id="grade" name="grade" [(ngModel)]="grade" required>
            <option *ngFor="let gradeOption of grades" [value]="gradeOption">Grade {{ gradeOption }}</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="employeeId">Employee ID</label>
          <input id="employeeId" name="employeeId" type="text" [(ngModel)]="employeeId" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" [(ngModel)]="email" required />
        </div>
      </div>

      <button type="submit" [disabled]="teacherForm.invalid">Add Teacher</button>
    </form>
  </section>

  <section class="teacher-list-card">
    <h2>Teacher List</h2>
    <div class="teacher-list-header">
      
      <div class="filter-section">
        <div class="filter-group">
          <label for="filterSubject">Filter by Subject</label>
          <input id="filterSubject" name="filterSubject" type="text" [(ngModel)]="filterSubject" placeholder="Enter subject" />
        </div>
        <div class="filter-group">
          <label for="filterGrade">Filter by Grade</label>
          <select id="filterGrade" name="filterGrade" [(ngModel)]="filterGrade">
            <option value="">All Grades</option>
            <option *ngFor="let gradeOption of grades" [value]="gradeOption">Grade {{ gradeOption }}</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filterEmployeeId">Filter by Employee ID</label>
          <input id="filterEmployeeId" name="filterEmployeeId" type="text" [(ngModel)]="filterEmployeeId" placeholder="Enter ID" />
        </div>
        <button type="button" (click)="clearFilters()" class="clear-btn">Clear Filters</button>
      </div>
    </div>

    <div *ngIf="filteredTeachers.length; else noTeachers">
      <table class="teacher-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Grade</th>
            <th>Employee ID</th>
            <th>Email</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let teacher of filteredTeachers; let i = index">
            <td>{{ teacher.firstName }} {{ teacher.lastName }}</td>
            <td>{{ teacher.subject }}</td>
            <td>{{ teacher.grade }}</td>
            <td>{{ teacher.employeeId }}</td>
            <td>{{ teacher.email }}</td>
            <td>
              <button type="button" class="delete-row" (click)="deleteTeacher(i)">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <ng-template #noTeachers>
      <p class="empty-state">No teachers added yet. Use the form above to create a teacher.</p>
    </ng-template>
  </section>
</div>
